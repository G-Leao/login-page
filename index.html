<!doctype html>
<html lang="PT-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="particles"></div>

    <div class="contacts">
      <nav>
        <a href="https://github.com/G-Leao" target="_blank" aria-label="GitHub">
          <i class="fa-brands fa-github"></i>
        </a>
        <a
          href="https://www.linkedin.com/in/gustavo-leão-24a7a82a2/"
          target="_blank"
          aria-label="LinkedIn"
        >
          <i class="fa-brands fa-linkedin"></i>
        </a>
        <a
          href="https://www.instagram.com/g.leao.03/"
          target="_blank"
          aria-label="Instagram"
        >
          <i class="fa-brands fa-instagram"></i>
        </a>
      </nav>
    </div>

    <main>
      <div class="login-icon">
        <i class="fa-solid fa-user-astronaut"></i>
      </div>
      <h1>Bem-vindo</h1>
      <p class="subtitle">Faça login para continuar</p>
      <input type="email" id="dados" placeholder="E-mail ou nome de usuário" />
      <input type="password" id="senha" placeholder="Digite sua senha" />
      <button id="btnLogin">Entrar</button>
      <a href="forgot.html" id="forgot">Esqueceu a senha?</a>
    </main>

    <footer>
      <p>DEV.LEAO &copy; Todos os direitos reservados</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
